id: datadays-crossref-portfolio
name: datadays-crossref-portfolio
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://rural-unity-56e33da5da-spaincentral.webapp.fabricapps.net
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: crossrefmodel
    type: fabric-semanticmodel
    config:
      workspaceId: 0245bb51-e0d1-40f1-b071-fcbbf1d7b155
      itemId: 2c0d666b-0d4d-451a-82f5-d244e9f5c760
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
